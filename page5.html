<!DOCTYPE html>
<html>
    <head>
        <title>Foodpanda POS Portal</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script type="text/javascript" src="globallogin.js"></script>
        <script>
            
        </script>
        <link href="styling.css" rel="stylesheet">
    </head>
    
    <body onload="fetchglobalusername(); navibar();">
        <div class="header">
            <div class="welcome-message"></div>
            <div style="height: auto; width: 60%;"><h1 style="color: white;">Foodpanda POS Portal</h1></div>
            <div style="height: auto; width: 20%;"><a href="login.html" style="color: white;">Logout</a></div>
        </div>

        <div class="navibar">
            
        </div>
        
        <!-- <div style="background-color: cornflowerblue; border-color: black; border-style:solid; padding: 5px; margin:10px; border-radius: 10px; height:auto;"> -->
            
            <div class="divcol">
    <!-- New Supplier Addition -->
            <h4>Add Supplier</h4>
            <p>Enter Supplier Details to add to the database.</p>
            <input id="i1" class="searchboxes" type="text" placeholder="Supplier ID" style="width: 320px; margin: 5px;">
            <input id="i2" class="searchboxes" type="text" placeholder="Supplier Name" style="width: 320px; margin: 5px;">
            <input id="i3" class="searchboxes" type="text" placeholder="Contact Name" style="width: 320px; margin: 5px;">
            <input id="i4" class="searchboxes" type="text" placeholder="Address" style="width: 320px; margin: 5px;">
            <input id="i5" class="searchboxes" type="text" placeholder="City" style="width: 320px; margin: 5px;">
            <input id="i6" class="searchboxes" type="text" placeholder="Postal Code" style="width: 320px; margin: 5px;">
            <input id="i7" class="searchboxes" type="text" placeholder="Country" style="width: 320px; margin: 5px;">
            <input id="i8" class="searchboxes" type="text" placeholder="Phone Number" style="width: 320px; margin: 5px;">
            <button onclick="supplierinsert()" style="color: black; margin: 10px;">Add New Supplier</button>
            <div class="supinsertsuccesscheck"></div>
            
            </div>
            
    <!-- View Supplier -->
            <div class="divcol">
            
            <h4>View Supplier</h4>
            <p>Enter Supplier Details to view from the database.</p>
            <input id="i9" class="searchboxes" type="text" placeholder="Enter Supplier ID, Supplier Name or Phone Number. " style="width: 350px; margin: 5px;">
            <button style="color: black; margin: 10px;" onclick="suppliercheck()">Find Supplier</button>
            <div id="suppliersdetails"></div>
            
            </div>
            
    <!-- Supplier Modification -->
            <div class="divcol">
            
            <h4>Modify Supplier</h4>
            <p>Enter Supplier Details to Modify from the database.</p>
            <input class="searchboxes" type="text" placeholder="Enter Supplier ID, Supplier Name or Phone Number. " style="width: 350px; margin: 5px;">
            <button style="color: black; margin: 10px;">Find Supplier</button>
            
            </div>
            
    <!-- Deleting Supplier -->
            <div class="divcol">
            
            <h4>Delete Supplier</h4>
            <p>Enter Supplier Details to delete from the database.</p>
            <input class="searchboxes" type="text" placeholder="Enter Supplier ID, Supplier Name or Phone Number. " style="width: 350px; margin: 5px;">
            <button style="color: black; margin: 10px;">Find Supplier</button>
            
            </div>
            
        <!-- </div> -->
    </body>
</html>
