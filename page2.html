<!DOCTYPE html>
<html>
    <head>
        <title>Foodpanda POS Portal</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script type="text/javascript" src="globallogin.js"></script>
        <link href="styling.css" rel="stylesheet">
    </head>
    <body onload="fetchglobalusername(); navibar();">
        <div class="header">
            <div class="welcome-message"></div>
            <div style="height: auto; width: 60%;"><h1 style="color: white;">Foodpanda POS Portal</h1></div>
            <div style="height: auto; width: 20%;"><a href="login.html" style="color: white;">Logout</a></div>
        </div>

        <div class="navibar">
            
        </div>

        <div style="background-color: skyblue; border-color: black; padding: 5px; margin:10px; border-radius: 10px; height:auto;">
            
            <div style="padding-left: 20px;">
            
            <h1 style="color: darkblue;">New Order</h1>
            <p style="color: darkblue;">Select Products to add to cart.</p>
            </div>

            <div class="divrow">
                <div class="divcol2">
                    <h2>Foodpanda Logo</h2>
                    <img src="OIP.webp" alt="Foodpanda Logo" height="280px" width="270px">
                </div>

                <div class="divcol2" id = "a2">
                    <h2>Burger</h2>
                    <img src="OIPP.webp" alt="Burger" height="280px" width="270px">
                </div>
            
                <div class="divcol2">
                    <h2>Sandwich</h2>
                    <img src="OIPPP.jpg" alt="Sandwich" height="280px" width="270px">
                </div>

                <div class="divcol2">
                    <h2>Omelette and Boiled Egg</h2>
                    <img src="OIPPPP.jpg" alt="Omelette and Boiled Egg" height="270px" width="280px">
                </div>

            </div>
            
            <div style="padding-left:10px;">
            <button style="color: black; margin: 10px;">Add to Cart</button>
            </div>
        </div>
    </body>
</html>
