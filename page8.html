<!DOCTYPE html>
<html>
    <head>
        <title>Order Create</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="referrer" content="unsafe-url">
        <script type="text/javascript" src="globallogin.js"></script>
        <script type="text/javascript" src="ordercreate.js"></script>
        <link href="styling.css" rel="stylesheet">
    </head>
    <body onload="callheader(); fetchglobalusername(); fetchproducts(); navibar();">
        <div class="header">
        </div>
        
        <div class="navibar">
        </div>
        
        <div class="totalbodybox">
            <div id="products-menu-box">
                <h1 style="display: block; color: white; text-align: center;">Products...</h1>
                <div id="products-menu">
                </div>
            </div>
            <div class="cart-main-box">
                <h1 style="height:auto; color:white; text-align: center;">Cart</h1>
                <div id="cart-container">
                </div>
                <div style="height: 5%;">
                    <h4 style="padding: 10px; color: white;">Total Price:</h4>
                </div>
                <button style="height: 5%; color: white; background-color: darkgreen; height: fit-content; width:fit-content">Order Submit</button>
            </div>
        </div>
    </body>
</html>
