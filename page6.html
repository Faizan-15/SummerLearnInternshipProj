<!DOCTYPE html>
<html>
    <head>
        <title>Foodpanda POS Portal</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="referrer" content="unsafe-url">
        <script type="text/javascript" src="globallogin.js"></script>
        <link href="styling.css" rel="stylesheet">
    </head>

    <body onload="fetchglobalusername(); navibar();">
        <div class="header">
            <div class="welcome-message"></div>
            <div style="height: auto; width: 60%;"><h1 style="color: white;">Foodpanda POS Portal</h1></div>
            <div style="height: auto; width: 20%;"><a href="login.html" style="color: white;">Logout</a></div>
        </div>

        <div class="navibar">
        
        </div>
        
        <!-- <div style="background-color: cornflowerblue; border-color: black; border-style:solid; padding: 5px; margin:10px; border-radius: 10px; height:auto;"> -->
            
            <div class="divcol">
    <!-- New Employee Addition -->
            <h4>Add Employee</h4>
            <p>Enter Employee Details to add to the database.</p>
            <input class="searchboxes" id="i1" type="number" placeholder="EmployeeID">
            <input class="searchboxes" id="i2" type="text" placeholder="Employee First Name">
            <input class="searchboxes" id="i3" type="text" placeholder="Employee Last Name">
            <input class="searchboxes" id="i4" type="text" placeholder="Birthdate">
            <input class="searchboxes" id="i5" type="text" placeholder="Photo">
            <input class="searchboxes" id="i6" type="text" placeholder="Notes">
            <button onclick="employeeinsert()" style="color: black; margin: 10px;">Add New Employee</button>
            <div class="empinsertsuccesscheck"></div>
            
            </div>
            
    <!-- View Employee -->
            <div class="divcol">
            
            <h4>View Employee</h4>
            <p>Enter Employee Details to view from the database.</p>
            <input id="i7" class="searchboxes" type="text" placeholder="Enter Employee ID, Employee Name or Phone Number. ">
            <button style="color: black; margin: 10px;" onclick="employeecheck()">Find Employee</button>
            <div id="employeesdetails"></div>
            
            </div>
            
    <!-- Employee Modification -->
            <div class="divcol">
            
            <h4>Modify Employee</h4>
            <p>Enter Employee Details to Modify from the database.</p>
            <input id="i8" class="searchboxes" type="text" placeholder="Enter Employee ID, Employee Name or Phone Number. ">
            <button style="color: black; margin: 10px;">Find Employee</button>
            
            </div>
            
    <!-- Deleting Employee -->
            <div class="divcol">
            
            <h4>Delete Employee</h4>
            <p>Enter Employee Details to delete from the database.</p>
            <input id="i9" class="searchboxes" type="text" placeholder="Enter Employee ID, Employee Name or Phone Number. ">
            <button style="color: black; margin: 10px;" onclick="employeedeleteconfirmation()">Delete Employee Data</button>
            <div id="empdeletesuccesscheck"></div>
            </div>
            
        <!-- </div> -->
    </body>
</html>
